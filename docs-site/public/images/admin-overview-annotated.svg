<svg xmlns="http://www.w3.org/2000/svg" width="1188" height="952" viewBox="0 0 1188 952" role="img" aria-labelledby="title description">
  <title id="title">HAF Bot admin overview</title>
  <desc id="description">The guild operations overview with callouts for setup coverage, the recommended next step, and feature status columns.</desc>
  <rect width="1188" height="952" fill="#090d15" />
  <image href="admin-overview.png" width="1188" height="832" />

  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-weight="700" text-anchor="middle">
    <g transform="translate(1032 158)">
      <circle r="18" fill="#aab5ff" stroke="#090d15" stroke-width="4" />
      <text y="5" font-size="14" fill="#090d15">1</text>
    </g>
    <g transform="translate(1048 244)">
      <circle r="18" fill="#aab5ff" stroke="#090d15" stroke-width="4" />
      <text y="5" font-size="14" fill="#090d15">2</text>
    </g>
    <g transform="translate(1104 374)">
      <circle r="18" fill="#aab5ff" stroke="#090d15" stroke-width="4" />
      <text y="5" font-size="14" fill="#090d15">3</text>
    </g>
  </g>

  <line x1="34" y1="844" x2="1154" y2="844" stroke="#283244" />
  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#edf0f7">
    <g transform="translate(34 878)">
      <circle cx="12" cy="-5" r="12" fill="#aab5ff" />
      <text x="12" y="0" text-anchor="middle" font-size="11" font-weight="700" fill="#090d15">1</text>
      <text x="34" y="0">Setup coverage summarizes configuration progress.</text>
    </g>
    <g transform="translate(620 878)">
      <circle cx="12" cy="-5" r="12" fill="#aab5ff" />
      <text x="12" y="0" text-anchor="middle" font-size="11" font-weight="700" fill="#090d15">2</text>
      <text x="34" y="0">Recommended next step links directly to setup.</text>
    </g>
    <g transform="translate(34 918)">
      <circle cx="12" cy="-5" r="12" fill="#aab5ff" />
      <text x="12" y="0" text-anchor="middle" font-size="11" font-weight="700" fill="#090d15">3</text>
      <text x="34" y="0">Configured, Available, and Paid access columns show each feature's current state.</text>
    </g>
  </g>
</svg>

name: haf-bot

services:
  app:
    build:
      context: .
      target: runtime
    env_file:
      - path: .env.local
        required: false
    environment:
      DATABASE_URL: postgresql://haf:haf_local_only@postgres:5432/haf
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-local-development-token}
      DISCORD_PUBLIC_KEY: ${DISCORD_PUBLIC_KEY:-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa}
      BOT_USER_ID: ${BOT_USER_ID:-123456789012345678}
      BETTER_AUTH_URL: http://localhost:8080
      HAF_ROLE: all
      HAF_DEPLOYMENT_MODE: self-hosted
      HAF_RUN_MIGRATIONS: "true"
      HAF_GATEWAY_ENABLED: "false"
      HAF_JOBS_ENABLED: "false"
      HAF_SCHEDULER_ENABLED: "false"
      HAF_MAINTENANCE_MODE: "false"
      HAF_STATUS_TOKEN: local-status-only
      PG_POOL_MAX: "8"
      PG_HTTP_POOL_MAX: "3"
      STAGING_MODE: "true"
      NODE_ENV: development
      PORT: "8080"
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    environment:
      POSTGRES_DB: haf
      POSTGRES_PASSWORD: haf_local_only
      POSTGRES_USER: haf
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U haf -d haf"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "127.0.0.1:5432:5432"

volumes:
  postgres-data:
